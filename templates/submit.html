<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result - Online Payments Fraud Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            background: #a8d4f0;
        }

        /* ── Navbar ── */
        nav {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 14px 30px;
            background: transparent;
        }

        nav a {
            text-decoration: none;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 20px;
            border-radius: 4px;
            background: #4a90b8;
            margin-left: 10px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        nav a:hover {
            background: #3a7ca5;
            transform: translateY(-1px);
        }

        /* ── Content ── */
        .content {
            padding: 20px 40px;
        }

        .content h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 18px;
        }

        .content p {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        /* ── Illustration ── */
        .illustration {
            display: flex;
            justify-content: center;
            padding: 0 40px 40px;
        }

        .illustration svg {
            width: 100%;
            max-width: 560px;
            height: auto;
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px 24px;
            }

            .content h1 {
                font-size: 22px;
            }

            .illustration {
                padding: 0 24px 30px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <a href="/">Home</a>
        <a href="/predict">Predict</a>
    </nav>

    <!-- Result -->
    <div class="content">
        <h1>Online Payments Fraud Detection</h1>
        <p>The predicted fraud for the online payment is {{ prediction_text }}</p>
    </div>

    <!-- Illustration -->
    <div class="illustration">
        <svg viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg">
            <!-- Hacker / Spy figure -->
            <g transform="translate(230, 10)">
                <!-- Hat -->
                <ellipse cx="0" cy="18" rx="42" ry="8" fill="#2c3e50"/>
                <path d="M-30,18 C-30,-10 30,-10 30,18" fill="#2c3e50"/>
                <!-- Head -->
                <ellipse cx="0" cy="35" rx="28" ry="22" fill="#e0d5c8"/>
                <!-- Sunglasses -->
                <rect x="-22" y="28" width="18" height="12" rx="3" fill="#1a1a2e"/>
                <rect x="4" y="28" width="18" height="12" rx="3" fill="#1a1a2e"/>
                <line x1="-4" y1="34" x2="4" y2="34" stroke="#1a1a2e" stroke-width="2"/>
                <rect x="-18" y="30" width="6" height="3" rx="1" fill="#fff" opacity="0.3"/>
                <rect x="8" y="30" width="6" height="3" rx="1" fill="#fff" opacity="0.3"/>
                <!-- Body -->
                <path d="M-28,55 C-35,55 -40,70 -40,90 L40,90 C40,70 35,55 28,55 Z" fill="#2c3e50"/>
                <path d="M-8,55 L0,70 L8,55" fill="none" stroke="#1a1a2e" stroke-width="2"/>
            </g>

            <!-- X marks -->
            <g transform="translate(170, 75)" opacity="0.5">
                <line x1="-6" y1="-6" x2="6" y2="6" stroke="#2c6e8a" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="6" y1="-6" x2="-6" y2="6" stroke="#2c6e8a" stroke-width="2.5" stroke-linecap="round"/>
            </g>
            <g transform="translate(195, 55)" opacity="0.4">
                <line x1="-7" y1="-7" x2="7" y2="7" stroke="#2c6e8a" stroke-width="3" stroke-linecap="round"/>
                <line x1="7" y1="-7" x2="-7" y2="7" stroke="#2c6e8a" stroke-width="3" stroke-linecap="round"/>
            </g>
            <g transform="translate(420, 130)" opacity="0.45">
                <line x1="-7" y1="-7" x2="7" y2="7" stroke="#2c6e8a" stroke-width="3" stroke-linecap="round"/>
                <line x1="7" y1="-7" x2="-7" y2="7" stroke="#2c6e8a" stroke-width="3" stroke-linecap="round"/>
            </g>

            <!-- Arrows -->
            <g transform="translate(175, 95)" opacity="0.45">
                <polyline points="0,0 -15,-8 -12,-1" fill="none" stroke="#2c6e8a" stroke-width="2" stroke-linecap="round"/>
            </g>
            <g transform="translate(300, 60)" opacity="0.45">
                <polyline points="0,0 15,-8 12,-1" fill="none" stroke="#2c6e8a" stroke-width="2" stroke-linecap="round"/>
            </g>

            <!-- Magnifying glass -->
            <g transform="translate(370, 80)">
                <circle cx="0" cy="0" r="14" fill="none" stroke="#2c6e8a" stroke-width="3" opacity="0.55"/>
                <line x1="10" y1="10" x2="20" y2="20" stroke="#2c6e8a" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
            </g>

            <!-- Dashed border -->
            <rect x="150" y="105" width="250" height="160" rx="12" fill="none" stroke="#2c6e8a" stroke-width="2.5" stroke-dasharray="10 6" opacity="0.4"/>

            <!-- Credit Card -->
            <rect x="155" y="110" width="240" height="150" rx="12" fill="#4a9ed0" opacity="0.9"/>
            <rect x="155" y="130" width="240" height="12" fill="#2c6e8a" opacity="0.35"/>
            <!-- Chip -->
            <rect x="185" y="160" width="38" height="28" rx="5" fill="#e8c547" opacity="0.85"/>
            <line x1="185" y1="170" x2="223" y2="170" stroke="#c9a83a" stroke-width="1"/>
            <line x1="185" y1="180" x2="223" y2="180" stroke="#c9a83a" stroke-width="1"/>
            <line x1="204" y1="160" x2="204" y2="188" stroke="#c9a83a" stroke-width="1"/>
            <!-- Card text lines -->
            <rect x="185" y="205" width="100" height="8" rx="4" fill="#fff" opacity="0.3"/>
            <rect x="185" y="222" width="60" height="8" rx="4" fill="#fff" opacity="0.2"/>
            <!-- Contactless -->
            <g transform="translate(350, 165)" opacity="0.5">
                <path d="M-6,4 C-6,-2 6,-2 6,4" fill="none" stroke="#fff" stroke-width="1.5"/>
                <path d="M-10,2 C-10,-6 10,-6 10,2" fill="none" stroke="#fff" stroke-width="1.5"/>
                <path d="M-14,0 C-14,-10 14,-10 14,0" fill="none" stroke="#fff" stroke-width="1.5"/>
            </g>

            <!-- Upload arrows -->
            <g transform="translate(390, 105)" opacity="0.45">
                <line x1="0" y1="12" x2="0" y2="-4" stroke="#2c6e8a" stroke-width="2.5" stroke-linecap="round"/>
                <polyline points="-5,1 0,-4 5,1" fill="none" stroke="#2c6e8a" stroke-width="2.5" stroke-linecap="round"/>
            </g>

            <!-- Gear icons -->
            <g transform="translate(110, 250)">
                <circle cx="0" cy="0" r="14" fill="none" stroke="#2c6e8a" stroke-width="2.5" opacity="0.5"/>
                <circle cx="0" cy="0" r="6" fill="#2c6e8a" opacity="0.4"/>
                <rect x="-2" y="-18" width="4" height="6" rx="1" fill="#2c6e8a" opacity="0.5"/>
                <rect x="-2" y="12" width="4" height="6" rx="1" fill="#2c6e8a" opacity="0.5"/>
                <rect x="-18" y="-2" width="6" height="4" rx="1" fill="#2c6e8a" opacity="0.5"/>
                <rect x="12" y="-2" width="6" height="4" rx="1" fill="#2c6e8a" opacity="0.5"/>
            </g>
            <g transform="translate(125, 268)">
                <circle cx="0" cy="0" r="8" fill="none" stroke="#2c6e8a" stroke-width="2" opacity="0.4"/>
                <circle cx="0" cy="0" r="3" fill="#2c6e8a" opacity="0.35"/>
            </g>

            <!-- Bar Chart -->
            <g transform="translate(120, 340)">
                <rect x="0" y="-40" width="14" height="40" rx="3" fill="#2c6e8a" opacity="0.7"/>
                <rect x="20" y="-60" width="14" height="60" rx="3" fill="#3a8cb8" opacity="0.8"/>
                <rect x="40" y="-48" width="14" height="48" rx="3" fill="#4a9ed0" opacity="0.7"/>
                <rect x="60" y="-72" width="14" height="72" rx="3" fill="#2c6e8a" opacity="0.8"/>
                <polyline points="7,-35 27,-55 47,-43 67,-67" fill="none" stroke="#1a4a6e" stroke-width="2" stroke-linecap="round"/>
                <polygon points="67,-67 63,-59 71,-59" fill="#1a4a6e"/>
            </g>

            <!-- Dashed line bottom -->
            <line x1="160" y1="300" x2="400" y2="300" stroke="#d4883a" stroke-width="2.5" stroke-dasharray="10 6" opacity="0.5"/>

            <!-- Shield with Lock -->
            <g transform="translate(390, 310)">
                <path d="M0,-48 L36,-34 L36,8 C36,30 18,48 0,56 C-18,48 -36,30 -36,8 L-36,-34 Z"
                      fill="#4a90b8" opacity="0.8" stroke="#3a7ca5" stroke-width="2"/>
                <path d="M0,-48 L36,-34 L36,8 C36,30 18,48 0,56 L0,-48 Z"
                      fill="#3a8cb8" opacity="0.55"/>
                <rect x="-12" y="-6" width="24" height="18" rx="4" fill="#e8c547" opacity="0.9"/>
                <path d="M-6,-6 L-6,-14 C-6,-23 6,-23 6,-14 L6,-6"
                      fill="none" stroke="#e8c547" stroke-width="3.5" stroke-linecap="round"/>
                <circle cx="0" cy="2" r="3" fill="#b8922e"/>
                <rect x="-1.5" y="2" width="3" height="6" rx="1" fill="#b8922e"/>
            </g>

            <!-- Decorative dots -->
            <circle cx="440" cy="220" r="4" fill="#2c6e8a" opacity="0.25"/>
            <circle cx="100" cy="300" r="3" fill="#3a8cb8" opacity="0.2"/>
        </svg>
    </div>

</body>
</html>
